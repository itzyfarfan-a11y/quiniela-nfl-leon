<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Quiniela NFL León · v72</title>
<style>
:root{--n:#013369;--r:#d50a0a;--s:#c9cdd2}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:linear-gradient(160deg,#eef2f6,#fff);color:#10233b}
.w{max-width:900px;margin:auto;padding:12px}
.h{background:linear-gradient(135deg,var(--n),#061b33);color:#fff;padding:20px;border-radius:18px;border:2px solid var(--s);text-align:center}
.logo{width:68px;height:78px;margin:auto auto 7px;border:4px solid #fff;display:grid;place-items:center;font-weight:1000;font-size:20px;color:var(--r);background:#fff;clip-path:polygon(50% 0,100% 18%,94% 78%,50% 100%,6% 78%,0 18%)}
h1{margin:4px 0;font-size:27px}
.c{background:#fff;padding:14px;margin:10px 0;border-radius:14px;border:1px solid #d7dce2}
.entry,.game{border:1px solid #d7dce2;border-radius:12px;padding:10px;margin:8px 0}
.input,select{padding:11px;border:1px solid #ccd3da;border-radius:9px;font-size:16px;width:100%}
.btn{padding:11px 14px;border:0;border-radius:10px;font-weight:900;cursor:pointer;min-height:44px}
.btn:disabled{opacity:.6;cursor:wait}
.red{background:var(--r);color:#fff}.navy{background:var(--n);color:#fff}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.muted{color:#667381;font-size:13px}
.table{width:100%;border-collapse:collapse}
.table td,.table th{padding:8px;border-bottom:1px solid #e2e6ea;text-align:left;font-size:14px}
.winnerRow{background:rgba(34,197,94,.25)!important;font-weight:900}
.status{padding:10px;border-radius:10px;background:#f3f6f9;margin-top:10px;font-size:14px}.compactResults{padding:12px}.autoPill{background:#e8f5e9;color:#166534;border:1px solid #86efac;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:900}.autoGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.autoGrid>div{background:#f5f7fa;border:1px solid #e1e5e9;border-radius:9px;padding:8px;text-align:center;font-size:12px}.autoGrid b{font-size:18px;display:block}.tableWrap{overflow-x:auto}.historyBox{background:#f7f9fb;border-radius:10px;padding:10px;margin-top:10px}.historyBox hr{border:0;border-top:1px solid #dfe4e8;margin:10px 0}@media(max-width:600px){.autoGrid{grid-template-columns:repeat(3,1fr)}.autoGrid>div{padding:6px 3px}.autoGrid span{display:block}.tableWrap{margin-left:-2px;margin-right:-2px}}
@media(max-width:600px){
.w{padding:8px}.btn{width:100%}.row .input{width:48%!important}
.table{display:block;overflow-x:auto;white-space:nowrap}
}
</style>
</head>
<body>
<div class="w">
  <div class="h">
    <div class="logo">NFL</div>
    <h1>ADMIN · QUINIELA NFL LEÓN</h1>
  </div>

  <div class="c" id="login">
    <input class="input" id="pin" type="password" value="NFFL2026" placeholder="Código de administradora" autocomplete="current-password">
    <button class="btn navy" style="width:100%;margin-top:8px" id="loginBtn" onclick="go()">ENTRAR</button>
    <div id="loginStatus" class="status" style="display:none"></div>
  </div>

  <div id="app"></div>
</div>

<script>
const API_BASE="https://picivrqgmckrwutarhyw.supabase.co/functions/v1/nfl-quiniela";
let P="";

function el(id){return document.getElementById(id)}

async function api(path,options={}){
  const opts={...options};
  const method=(opts.method||"GET").toUpperCase();
  opts.headers={...(options.headers||{})};

  if(method!=="GET" && opts.body && typeof opts.body==="object" && !(opts.body instanceof FormData) && !(opts.body instanceof URLSearchParams)){
    opts.body=new URLSearchParams(opts.body);
  }

  // Usamos application/x-www-form-urlencoded para que el POST sea una
  // petición simple y no dispare preflight CORS desde GitHub Pages.
  if(method!=="GET" && opts.body instanceof URLSearchParams){
    opts.headers["Content-Type"]="application/x-www-form-urlencoded;charset=UTF-8";
  }

  const r=await fetch(API_BASE+path,opts);
  let x={};
  try{x=await r.json()}catch(_){}
  if(!r.ok)throw Error(x.error||("HTTP "+r.status));
  return x;
}

async function go(){
  P=el("pin").value.trim();
  if(!P){
    alert("Escribe el código de administradora.");
    return;
  }
  const btn=el("loginBtn"), status=el("loginStatus");
  btn.disabled=true;
  btn.textContent="ENTRANDO…";
  status.style.display="block";
  status.textContent="Verificando acceso…";
  try{
    await load();
    el("login").style.display="none";
  }catch(e){
    status.textContent="Error: "+(e?.message||e);
    alert("No se pudo entrar: "+(e?.message||e));
    btn.disabled=false;
    btn.textContent="ENTRAR";
  }
}

async function load(){
  let d;
  try{
    d=await api("/admin/data?pin="+encodeURIComponent(P),{method:"GET"});
  }catch(e){
    if(String(e?.message||e)==="No autorizado"){
      d=await api("/admin/data",{method:"POST",body:{pin:P}});
    }else throw e;
  }

  let h=`<div class="c">
    <div class="row"><b>Jornada ${d.week.week_label}</b><b>Premio $${d.prize}</b></div>
    <div class="muted">${d.count} participantes · ${d.paid} pagos confirmados</div>
    <button class="btn navy" onclick="refresh()">↻ Actualizar NFL</button>
    <div class="row" style="margin-top:8px">
      <button class="btn navy" onclick="psync('wild_card')">Wild Card</button>
      <button class="btn navy" onclick="psync('divisional')">Divisional</button>
      <button class="btn navy" onclick="psync('conference')">Conference</button>
      <button class="btn red" onclick="psync('super_bowl')">Super Bowl</button>
    </div>
  </div>
  <div class="c"><h3>Pagos</h3>`;

  d.entries.forEach(e=>h+=`<div class="entry">
    <div><b>${e.participant_name}</b><div>${e.total_points??0} puntos</div>
    <div class="muted">${e.payment_status==="paid"?"Pago confirmado ✓":"Pago pendiente"}</div></div>
    <button class="btn ${e.payment_status==="paid"?"navy":"red"}" onclick="pay('${e.id}','${e.payment_status==="paid"?"pending":"paid"}',this)">
      ${e.payment_status==="paid"?"Pagado ✓ · Quitar aprobación":"Confirmar pago"}
    </button>
  </div>`);

  const finishedGames=(d.games||[]).filter(g=>g.away_score!==null&&g.home_score!==null&&g.winner_abbr).length;
  const totalGames=(d.games||[]).length;
  h+=`</div><div class="c compactResults">
    <div class="row"><h3 style="margin:0">🏈 Resultados NFL automáticos</h3><span class="autoPill">🔄 AUTOMÁTICO</span></div>
    <div class="autoGrid">
      <div><b>${finishedGames}</b><span> terminados</span></div>
      <div><b>${totalGames-finishedGames}</b><span> pendientes</span></div>
      <div><b>${totalGames}</b><span> partidos</span></div>
    </div>
    <div class="muted" style="margin-top:7px">No captures marcadores ni ganadores. Se sincronizan automáticamente y la tabla se recalcula sola.</div>
  </div>`;

  if(d.week.phase==="super_bowl")h+=`<div class="c">
    <b>🥤 Gatorade real del Super Bowl</b>
    <select class="input" id="gca">
      <option value="">Selecciona color</option>
      <option>Naranja</option><option>Amarillo</option><option>Azul</option>
      <option>Verde</option><option>Rojo</option><option>Morado</option><option>Otro</option>
    </select>
    <button class="btn navy" style="margin-top:8px" onclick="setGatorade()">Guardar Gatorade</button>
  </div>`;

  h+=`<div class="c">
    <h3 style="margin-top:0">📊 Tabla de posiciones</h3>
    <div class="muted" style="margin-bottom:7px">Orden: puntos totales → desempate → aciertos</div>
    <div class="tableWrap"><table class="table">
      <tr><th>#</th><th>Nombre</th><th>Aciertos</th><th>Puntos</th><th>Desempate</th><th>Pago</th></tr>`;

  d.entries.forEach((e,i)=>h+=`<tr>
    <td>${i+1}</td><td>${e.participant_name}</td>
    <td>${e.correct_picks??0} ${e.star_points>0?"⭐":"—"}</td>
    <td><b>${e.total_points??0}</b></td>
    <td>${e.score_distance===999999||e.score_distance==null?"—":e.score_distance}</td>
    <td>${e.payment_status}</td>
  </tr>`);

  h+=`</table></div></div>
  <div class="c">
    <h3 style="margin-top:0">🏆 Historial y tabla general</h3>
    <button class="btn navy" id="historyBtn" onclick="hist()">Ver historial</button>
    <div id="history" style="margin-top:10px"></div>
  </div>`;
  el("app").innerHTML=h;
}

async function pay(id,status,btn){
  const isUndo=status==="pending";
  const msg=isUndo
    ? "¿Seguro que quieres quitar la aprobación de este pago?\n\nEl registro NO se elimina; volverá a quedar como pendiente y dejará de contar para el premio."
    : "¿Confirmar que este participante ya realizó el pago?\n\nUna vez confirmado, contará para el premio.";
  if(!confirm(msg))return;
  const original=btn?.textContent||"";
  if(btn){btn.disabled=true;btn.textContent=isUndo?"Quitando…":"Guardando…";}
  try{
    await api("/admin/payment",{method:"POST",body:JSON.stringify({pin:P,id,status})});
    await load();
  }catch(e){
    if(btn){btn.disabled=false;btn.textContent=original;}
    alert("⚠️ No se pudo actualizar el pago: "+(e.message||e));
  }
}

async function refresh(){
  await api("/admin/refresh",{method:"POST",body:JSON.stringify({pin:P})});
  await load();
}

async function setGatorade(){
  const c=el("gca").value;
  if(!c){alert("Selecciona el color.");return}
  const d=await api("/admin/data",{method:"POST",body:JSON.stringify({pin:P})});
  await api("/admin/gatorade",{method:"POST",body:JSON.stringify({pin:P,week_id:d.week.id,color:c})});
  alert("Gatorade real guardado.");
  await load();
}

async function psync(stage){
  const now=new Date();
  const season=now.getUTCMonth()>=7?now.getUTCFullYear():now.getUTCFullYear()-1;
  const d=await api("/admin/playoff-sync",{method:"POST",body:JSON.stringify({pin:P,stage,season})});
  alert("Etapa sincronizada: "+d.week.week_label);
  await load();
}


async function hist(){
  const box=el("history"),btn=el("historyBtn");
  if(!box)return;
  box.innerHTML='<div class="status">Cargando historial…</div>';
  if(btn){btn.disabled=true;btn.textContent="Cargando…";}
  try{
    const d=await api("/admin/history",{method:"POST",body:JSON.stringify({pin:P})});
    let h='<div class="historyBox"><b>Ganadores anteriores</b>';
    if(!(d.winners||[]).length)h+='<div class="muted" style="margin-top:6px">Todavía no hay jornadas terminadas.</div>';
    (d.winners||[]).forEach(w=>h+=`<div style="margin-top:6px">🏆 ${w.participant_name} · ${w.total_points} pts · $${w.prize}</div>`);
    h+='<hr><b>Tabla general acumulada</b>';
    if(!(d.general||[]).length)h+='<div class="muted" style="margin-top:6px">Sin participantes con pago confirmado todavía.</div>';
    (d.general||[]).forEach((x,i)=>h+=`<div style="margin-top:6px">${i+1}. ${x.name} — ${x.points} pts · ${x.weeks} jornadas</div>`);
    h+='</div>';
    box.innerHTML=h;
  }catch(e){
    box.innerHTML=`<div class="status" style="color:#b91c1c">⚠️ No se pudo cargar el historial: ${e.message||e}</div>`;
  }finally{
    if(btn){btn.disabled=false;btn.textContent="Ver historial";}
  }
}
</script>
</body>
</html>
